name: 🐍 PyTest

on:
  push:
    branches: [ "main" , "dev" , "feature/github-action" ] 
    paths-ignore:
      - '**.md' # Ignore les changements de documentation
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: 🧪 Run Pytest
    runs-on: ubuntu-latest
    
    # Stratégie pour tester potentiellement plusieurs versions de Python (optionnel)
    strategy:
      matrix:
        python-version: ["3.11"] # Version utilisée dans votre Dockerfile

    steps:
      # 1. Récupération du code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installation de Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # Active le cache pour accélérer les runs suivants

      # 3. Installation des dépendances
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Installation des libs du bot
          if [ -f bot/requirements.txt ]; then pip install -r bot/requirements.txt; fi
          # Installation des outils de test (non présents dans votre requirements.txt actuel)
          pip install pytest pytest-cov pytest-asyncio

      # 4. Configuration de l'environnement (Variables mockées)
      - name: Setup Environment Variables
        run: |
          echo "OLLAMA_HOST=http://localhost:11434" >> $GITHUB_ENV
          echo "MODEL=qwen2.5:1.5b" >> $GITHUB_ENV
          echo "PYTHONPATH=$PYTHONPATH:." >> $GITHUB_ENV # Crucial pour importer 'bot.src...'

      # 5. Exécution des tests avec couverture
      - name: Run Tests with Coverage
        run: |
          # On lance pytest depuis la racine, en pointant vers le dossier pytest/
          pytest pytest/ -v --cov=bot --cov-report=term-missing --junitxml=test-results.xml

      # 6. (Optionnel) Publication du résumé des tests dans GitHub
      - name: Publish Test Results
        uses: test-summary/action@v2
        if: always() # S'exécute même si les tests échouent
        with:
          paths: "test-results.xml"
